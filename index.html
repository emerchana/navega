<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD Navega - Benjamín</title>
  <style>
    :root {
      --rojo-navega: #d32f2f;
      --fondo: #f4f6f8;
      --texto: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fondo);
      color: var(--texto);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--rojo-navega);
      color: white;
      text-align: center;
      padding: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 5px 0 0 0; opacity: 0.9; }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    h2 {
      margin-top: 0;
      color: var(--rojo-navega);
      border-bottom: 2px solid var(--fondo);
      padding-bottom: 8px;
    }

    .btn-rfef {
      display: inline-block;
      background-color: var(--rojo-navega);
      color: white;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 10px;
    }

    .cargando {
      color: #666;
      font-style: italic;
    }

    /* Resaltar CD Navega */
    tr:has(td:nth-child(2):contains("NAVEGA")),
    tr:has(td:contains("Navega")),
    .destacado {
      background-color: #ffebee !important;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>CD Navega - Categoría Benjamín</h1>
    <p>Seguimiento Liga Oficial RFCYLF</p>
  </header>

  <div class="container">

    <!-- CLASIFICACIÓN -->
    <div class="card">
      <h2>Clasificación General</h2>
      <div id="contenedor-clasificacion" class="cargando">Cargando clasificación...</div>
    </div>

    <!-- RESULTADOS -->
    <div class="card">
      <h2>Últimos Resultados</h2>
      <div id="contenedor-resultados" class="cargando">Cargando resultados...</div>
    </div>

    <!-- CALENDARIO COMPLETO -->
    <div class="card">
      <h2>Calendario de Competición</h2>
      <div id="contenedor-calendario" class="cargando">Cargando calendario...</div>
    </div>

  </div>

  <script>
    // Usamos el servicio AllOrigins para esquivar el bloqueo CORS de la federación
    const PROXY = 'https://api.allorigins.win/get?url=';

    const URL_CLASIFICACION = 'https://www.rfcylf.es/pnfg/NPcd/NFG_VisClasificacion?cod_primaria=1000120&codgrupo=24219165&codcompeticion=24219160&codjornada=1';
    const URL_RESULTADOS = 'https://www.rfcylf.es/pnfg/NPcd/NFG_CmpJornada?cod_primaria=1000120&CodTemporada=22&CodGrupo=24219165&CodCompeticion=24219160&CodJornada=1';
    const URL_CALENDARIO = 'https://www.rfcylf.es/pnfg/NPcd/NFG_VisCalendario_Vis?cod_primaria=1000120&codgrupo=24219165&codcompeticion=24219160&codtemporada=22&CodJornada=1&CDetalle=1';

    async function cargarSeccion(url, idContenedor) {
      const contenedor = document.getElementById(idContenedor);
      try {
        const response = await fetch(PROXY + encodeURIComponent(url));
        const data = await response.json();
        
        if (!data.contents) {
          throw new Error("Sin respuesta");
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // Extraer las tablas principales de la web de la federación
        const tablas = doc.querySelectorAll('table');

        if (tablas.length > 0) {
          contenedor.innerHTML = '';
          tablas.forEach(tabla => {
            // Remover enlaces internos de la federación para no romper la navegación
            tabla.querySelectorAll('a').forEach(a => a.removeAttribute('href'));
            contenedor.appendChild(tabla);
          });
        } else {
          contenedor.innerHTML = `<p>No se pudo formatear la tabla. <a href="${url}" target="_blank" class="btn-rfef">Ver directamente en RFCYLF</a></p>`;
        }
      } catch (error) {
        console.error("Error al cargar:", error);
        contenedor.innerHTML = `
          <p>La web de la federación requiere consulta directa:</p>
          <a href="${url}" target="_blank" class="btn-rfef">Abrir sección en la RFCYLF</a>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarSeccion(URL_CLASIFICACION, 'contenedor-clasificacion');
      cargarSeccion(URL_RESULTADOS, 'contenedor-resultados');
      cargarSeccion(URL_CALENDARIO, 'contenedor-calendario');
    });
  </script>

</body>
</html>
