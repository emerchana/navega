<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD Navega - Benjamín</title>
  <style>
    :root {
      --rojo-navega: #d32f2f;
      --rojo-oscuro: #9a0007;
      --fondo: #f4f6f8;
      --texto: #333;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fondo);
      color: var(--texto);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--rojo-navega);
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .escudo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 5px 0 0 0; opacity: 0.9; }

    nav {
      position: sticky;
      top: 0;
      background-color: var(--rojo-oscuro);
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
    }

    nav a:hover { background-color: rgba(255, 255, 255, 0.35); }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      scroll-margin-top: 60px;
      overflow-x: auto;
    }

    h2 {
      margin-top: 0;
      color: var(--rojo-navega);
      border-bottom: 2px solid var(--fondo);
      padding-bottom: 8px;
    }

    .cargando {
      padding: 20px;
      text-align: center;
      color: #666;
      font-style: italic;
    }

    .btn-enlace {
      display: inline-block;
      background-color: var(--rojo-navega);
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* Formato para tablas inyectadas */
    table {
      width: 100% !important;
      border-collapse: collapse;
      margin-top: 10px;
    }

    tr:has(td:contains("Navega")), 
    tr:has(td:contains("NAVEGA")) {
      background-color: #ffebee !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9x3-PuqSSwYS4EIgQr69Xo2bKz1YBLJvGTkNWdVzq9UiftQKYnwUZbgI&s=10" alt="Escudo CD Navega" class="escudo">
      <div>
        <h1>CD Navega - Benjamín</h1>
        <p>Liga Oficial RFCYLF</p>
      </div>
    </div>
  </header>

  <nav>
    <a href="#clasificacion">Clasificación</a>
    <a href="#resultados">Resultados</a>
    <a href="#calendario">Calendario</a>
  </nav>

  <div class="container">

    <div class="card" id="clasificacion">
      <h2>Clasificación General</h2>
      <div id="content-clasificacion" class="cargando">Cargando clasificación...</div>
    </div>

    <div class="card" id="resultados">
      <h2>Resultados y Jornadas</h2>
      <div id="content-resultados" class="cargando">Cargando resultados...</div>
    </div>

    <div class="card" id="calendario">
      <h2>Calendario Completo</h2>
      <div id="content-calendario" class="cargando">Cargando calendario...</div>
    </div>

  </div>

  <script>
    const PROXY = 'https://corsproxy.io/?';

    const URLS = {
      clasificacion: 'https://www.rfcylf.es/pnfg/NPcd/NFG_VisClasificacion?cod_primaria=1000120&codgrupo=24219165&codcompeticion=24219160&codjornada=1',
      resultados: 'https://www.rfcylf.es/pnfg/NPcd/NFG_CmpJornada?cod_primaria=1000120&CodTemporada=22&CodGrupo=24219165&CodCompeticion=24219160&CodJornada=1',
      calendario: 'https://www.rfcylf.es/pnfg/NPcd/NFG_VisCalendario_Vis?cod_primaria=1000120&codgrupo=24219165&codcompeticion=24219160&codtemporada=22&CodJornada=1&CDetalle=1'
    };

    async function cargarSeccion(targetId, targetUrl) {
      const container = document.getElementById(targetId);
      try {
        const response = await fetch(PROXY + encodeURIComponent(targetUrl));
        if (!response.ok) throw new Error('Error al conectar con la RFCYLF');
        
        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        // Extraer las tablas principales de la página devuelta
        const tablas = doc.querySelectorAll('table');

        if (tablas.length > 0) {
          container.innerHTML = '';
          tablas.forEach(tabla => {
            // Eliminar enlaces para evitar saltos raros a la web original
            tabla.querySelectorAll('a').forEach(a => {
              a.removeAttribute('href');
              a.style.color = 'inherit';
              a.style.textDecoration = 'none';
            });
            container.appendChild(tabla);
          });
        } else {
          throw new Error('No se encontraron tablas de datos.');
        }

      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <p>No se pudo incrustar el contenido directamente.</p>
          <a href="${targetUrl}" target="_blank" class="btn-enlace">Abrir en la web de la RFCYLF</a>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarSeccion('content-clasificacion', URLS.clasificacion);
      cargarSeccion('content-resultados', URLS.resultados);
      cargarSeccion('content-calendario', URLS.calendario);
    });
  </script>

</body>
</html>
