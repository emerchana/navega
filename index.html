<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CD Navega - Benjamín</title>
  <style>
    :root {
      --rojo-navega: #d32f2f;
      --fondo: #f4f6f8;
      --texto: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fondo);
      color: var(--texto);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--rojo-navega);
      color: white;
      text-align: center;
      padding: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 5px 0 0 0; opacity: 0.9; }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: var(--rojo-navega);
      border-bottom: 2px solid var(--fondo);
      padding-bottom: 8px;
    }

    .iframe-container {
      width: 100%;
      height: 550px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>CD Navega - Categoría Benjamín</h1>
    <p>Seguimiento Liga Oficial RFCYLF</p>
  </header>

  <div class="container">

    <!-- CLASIFICACIÓN -->
    <div class="card">
      <h2>Clasificación General</h2>
      <div class="iframe-container">
        <iframe src="https://www.rfcylf.es/pnfg/NPcd/NFG_VisClasificacion?cod_primaria=1000120&codgrupo=24219165&codcompeticion=24219160&codjornada=1"></iframe>
      </div>
    </div>

    <!-- RESULTADOS -->
    <div class="card">
      <h2>Resultados y Jornadas</h2>
      <div class="iframe-container">
        <iframe src="https://www.rfcylf.es/pnfg/NPcd/NFG_CmpJornada?cod_primaria=1000120&CodTemporada=22&CodGrupo=24219165&CodCompeticion=24219160&CodJornada=1"></iframe>
      </div>
    </div>

    <!-- CALENDARIO -->
    <div class="card">
      <h2>Calendario Completo</h2>
      <div class="iframe-container">
        <iframe src="https://www.rfcylf.es/pnfg/NPcd/NFG_VisCalendario_Vis?cod_primaria=1000120&codgrupo=24219165&codcompeticion=24219160&codtemporada=22&CodJornada=1&CDetalle=1"></iframe>
      </div>
    </div>

  </div>

</body>
</html>
